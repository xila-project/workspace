name: Workspace integration
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/validate_workspace.py
      - uses: jdx/mise-action@v5.2.2
      - run: mise run ci:lint-workflows

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: quality
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize pinned integration repositories
        run: git submodule update --init --recursive -- repositories/core repositories/platforms repositories/applications repositories/package_manager repositories/packages
      - uses: ./.github/actions/setup-rust
        with:
          cache-enabled: "false"
      - name: Bootstrap native integration dependencies with mise
        run: mise run ci:packages-integration
      - run: mise run integration:metadata
      - run: mise run integration:check

  required:
    if: always()
    needs: [quality, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful workspace validation
        env:
          QUALITY: ${{ needs.quality.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: test "$QUALITY" = success && test "$INTEGRATION" = success
