name: Workspace integration
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Validate | Workspace repository graph"
        run: python3 scripts/validate_workspace.py
      - name: "Setup | Activate mise"
        uses: jdx/mise-action@v5.2.2
      - name: "Lint | GitHub Actions"
        run: mise run ci:lint-workflows

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: quality
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Initialize pinned source repositories"
        run: git submodule update --init --recursive -- repositories/core repositories/platforms repositories/applications repositories/package_manager repositories/packages
      - name: "Setup | Rust toolchain and build cache"
        uses: ./.github/actions/setup-rust
        with:
          cache-enabled: "false"
      - name: "Setup | Native build dependencies via mise"
        run: mise run ci:packages-integration
      - name: "Setup | Locked Node dependencies via mise"
        run: mise run ci:node-dependencies
      - name: "Validate | Cross-repository Cargo graph"
        run: mise run integration:metadata
      - name: "Test | Cross-repository integration"
        run: mise run integration:check

  required:
    if: always()
    needs: [quality, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Gate | Verify workspace validations"
        env:
          QUALITY: ${{ needs.quality.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: test "$QUALITY" = success && test "$INTEGRATION" = success
