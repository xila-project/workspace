# Reusable workflow for product repositories. Callers must trigger this on push to main,
# schedule, or workflow_dispatch, and must never trigger it on pull_request (forks do not
# receive secrets, and source inventories describe accepted commits).
name: Nanobom vulnerability inventory
on:
  workflow_call:
    inputs:
      project:
        description: "Nanobom project slug (defaults to the lowercased repository name)"
        type: string
        required: false
        default: ""
      scan-path:
        description: "Path to scan for dependencies"
        type: string
        required: false
        default: "."
      fail-on:
        description: "Optional finding severity threshold to fail the job (defaults to vars.NANOBOM_FAIL_ON)"
        type: string
        required: false
        default: ""
    secrets:
      NANOBOM_TOKEN:
        description: "Nanobom upload token"
        required: true
permissions:
  contents: read
jobs:
  inventory:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Setup | Checkout source"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Validate | Nanobom upload credentials"
        id: credentials
        env:
          NANOBOM_TOKEN: ${{ secrets.NANOBOM_TOKEN }}
          INPUT_PROJECT: ${{ inputs.project }}
        run: |
          if [ -z "${NANOBOM_TOKEN// }" ]; then
            echo "::error::Set the organization Actions secret NANOBOM_TOKEN to a Nanobom upload token before running this workflow."
            exit 1
          fi
          if [ -n "$INPUT_PROJECT" ]; then
            project="$INPUT_PROJECT"
          else
            repo="${GITHUB_REPOSITORY#*/}"
            project=$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')
            if [ "$project" = ".github" ]; then
              project="github-community"
            fi
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
      - name: "Scan | Generate and upload source SBOM"
        # nanobom-action v1.1.1; its Syft generator does not execute project builds.
        uses: AlixANNERAUD/nanobom-action@5860bbf2b8b32a42d57f725c548f7be224c5fc03
        with:
          url: ${{ vars.NANOBOM_URL || 'https://vulnerabilities.xila.dev' }}
          organization: ${{ vars.NANOBOM_ORGANIZATION || 'xila-project' }}
          token: ${{ secrets.NANOBOM_TOKEN }}
          project: ${{ steps.credentials.outputs.project }}
          scan-path: ${{ inputs.scan-path }}
          source-commit: ${{ github.sha }}
          wait: "true"
          fail-on: ${{ inputs.fail-on || vars.NANOBOM_FAIL_ON || '' }}
