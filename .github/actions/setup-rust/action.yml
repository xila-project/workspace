name: Setup Xila Rust toolchain and compilation cache
description: Prepare the caller repository's mise-pinned Rust toolchain and optionally mr-boxington
inputs:
  toolchain-task:
    description: mise task that emits version=<toolchain> to GITHUB_OUTPUT
    required: false
    default: ci:toolchain
  cache-enabled:
    description: Enable mr-boxington for subsequent mise tasks
    required: false
    default: "true"
  cache-mode:
    description: mr-boxington GitHub cache mode (target or objects)
    required: false
    default: target
  cache-generation:
    description: Repository/job-specific cache generation key
    required: false
    default: v1
  save-on-workflow-dispatch:
    description: Allow cache upload from a trusted, manually dispatched run
    required: false
    default: "false"
  working-directory:
    description: Cargo workspace containing the cached target directory
    required: false
    default: .
  incremental-compilation:
    description: >-
      Let Cargo compile workspace crates incrementally. Off by default: the job
      exports CARGO_INCREMENTAL=0, because continuous integration builds start
      from a fresh or restored target directory, never from an earlier
      incremental session.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Continuous integration builds restore a cache instead of continuing an
    # incremental session, so incremental data only grows the target directory,
    # and compiler caches (mr-boxington, like sccache) cannot store or reuse
    # incrementally compiled workspace crates. mr-boxington already turns
    # incremental compilation off for the Cargo calls it wraps; this also covers
    # Cargo calls that bypass it (cache disabled, XILA_MBX=0, or direct calls).
    - name: "Setup | Disable incremental compilation"
      if: ${{ inputs.incremental-compilation != 'true' }}
      shell: bash
      run: echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
    - name: "Setup | Activate mise"
      uses: jdx/mise-action@v5.2.2
    - name: "Setup | Pinned Rust toolchain"
      id: toolchain
      shell: bash
      env:
        MISE_ENV: ci
        XILA_TOOLCHAIN_TASK: ${{ inputs.toolchain-task }}
      run: mise run "$XILA_TOOLCHAIN_TASK"
    - name: "Setup | mr-boxington build cache"
      if: ${{ inputs.cache-enabled == 'true' }}
      uses: jdx/mr-boxington-action@v1
      with:
        toolchain: ${{ steps.toolchain.outputs.version }}
        github-cache-mode: ${{ inputs.cache-mode }}
        cache-generation: ${{ inputs.cache-generation }}
        working-directory: ${{ inputs.working-directory }}
        save-on-workflow-dispatch: ${{ inputs.save-on-workflow-dispatch }}
    - name: "Setup | Optional Cargo wrapper"
      if: ${{ inputs.cache-enabled == 'true' }}
      shell: bash
      run: echo 'XILA_MBX=1' >> "$GITHUB_ENV"
