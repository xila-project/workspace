# Shared, version-pinned tooling for Xila repositories.
# Consumers may include this file from a pinned workspace revision.
[vars]
rust_version = "1.99.0"
nightly_version = "nightly-2026-10-12"
node_version = "24.22.0"
taplo_version = "0.10.0"
actionlint_version = "1.7.7"
shellcheck_version = "0.11.0"
mr_boxington_version = "1.26.0"

[wrappers.cargo]
command = "env"
args = ["{% if env.XILA_MBX | default(value='0') == '1' %}mbx{% else %}cargo{% endif %}"]
env = { MBX_CARGO_SHIM_MODE = "1" }

# Native libraries for the workspace integration runner (Linux/apt).
# mise install does not apply system packages; CI calls bootstrap explicitly.
[bootstrap.packages]
"apt:clang" = { env = "workspace-integration" }
"apt:libclang-dev" = { env = "workspace-integration" }
"apt:pkg-config" = { env = "workspace-integration" }
"apt:libasound2-dev" = { env = "workspace-integration" }
"apt:libudev-dev" = { env = "workspace-integration" }
"apt:libxkbcommon-dev" = { env = "workspace-integration" }
"apt:libwayland-dev" = { env = "workspace-integration" }
"apt:libx11-dev" = { env = "workspace-integration" }
"apt:libxkbcommon-x11-dev" = { env = "workspace-integration" }
